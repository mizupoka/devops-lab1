name: Python CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Репозиторийді жүктеп алу (Checkout)
      uses: actions/checkout@v4

    - name: Python баптау
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Тәуелділіктерді орнату
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Синтаксисті тексеру (Құрастыру кезеңі)
      run: |
        python -m py_compile hello.py

    - name: Тесттерді іске қосу (Тестілеу кезеңі)
      run: |
        pytest

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Тестілік ортаға орналастыру (Deploy)
      run: |
        echo "Тесттер сәтті өтті. Жоба тестілік ортаға сәтті орналастырылды!"
